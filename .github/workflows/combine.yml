name: Auto Combine M3U Playlists

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Combine Playlists (Force Group Title Replace)
        run: |
          cat << 'EOF' > process_m3u.py
          import os
          import re
          import requests
          from urllib.parse import urlparse
          from datetime import datetime, timezone

          SOURCES_FILE = "sources.txt"
          OUTPUT_FILE = "master.m3u"

          UA = "Mozilla/5.0"

          # Filename থেকে group name বের করবে
          def get_group(url):
              filename = os.path.basename(urlparse(url).path)
              return filename.replace(".m3u", "")

          def main():
              if not os.path.exists(SOURCES_FILE):
                  print("❌ sources.txt missing")
                  exit(1)

              with open(SOURCES_FILE, "r") as f:
                  sources = [x.strip() for x in f if x.strip() and not x.startswith("#")]

              output = []
              output.append("#EXTM3U")
              output.append(f"# Generated {datetime.now(timezone.utc)} UTC")

              seen = set()

              for url in sources:
                  group = get_group(url)
                  print("Processing group:", group)

                  try:
                      r = requests.get(url, headers={"User-Agent": UA}, timeout=30)
                      r.raise_for_status()
                      lines = r.text.splitlines()
                  except Exception as e:
                      print("⚠️ Download failed:", e)
                      continue

                  last_extinf = None

                  for line in lines:
                      line = line.rstrip()

                      if line.startswith("#EXTM3U"):
                          continue

                      # EXTINF line → Always force correct group-title
                      if line.startswith("#EXTINF"):

                          # যদি group-title আগে থাকে → replace করবে
                          if 'group-title="' in line:
                              line = re.sub(
                                  r'group-title="[^"]*"',
                                  f'group-title="{group}"',
                                  line
                              )

                          # যদি group-title না থাকে → add করবে
                          else:
                              line = line.replace(
                                  "#EXTINF:",
                                  f'#EXTINF: group-title="{group}" ',
                                  1
                              )

                          last_extinf = line
                          continue

                      # URL line
                      if line.startswith("http"):

                          if line not in seen:
                              seen.add(line)

                              if last_extinf:
                                  output.append(last_extinf)

                              output.append(line)

                          last_extinf = None
                          continue

                      # অন্য সব metadata unchanged থাকবে
                      if line.startswith("#"):
                          output.append(line)

              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  f.write("\n".join(output))

              print("✅ Done. Channels:", len(seen))

          if __name__ == "__main__":
              main()
          EOF

          pip install requests
          python3 process_m3u.py

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add master.m3u

          if git diff --staged --quiet; then
            echo "ℹ️ No changes."
          else
            git commit -m "🤖 Auto-update: Force Group Titles"
            git push
          fi
