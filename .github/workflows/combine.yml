name: Auto Combine M3U Playlists

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Process Playlists
        run: |
          cat << 'EOF' > process_m3u.py
          import os
          import re
          import requests
          from datetime import datetime, timezone

          # Configuration
          SOURCES_FILE = "sources.txt"
          OUTPUT_FILE = "master.m3u"
          USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"

          def get_filename_from_url(url):
              path = url.split('?')[0]
              basename = os.path.basename(path)
              name, _ = os.path.splitext(basename)
              return name if name else "Unknown"

          def download_and_parse():
              seen_urls = set()
              master_content = []

              if not os.path.exists(SOURCES_FILE):
                  print(f"❌ Error: {SOURCES_FILE} not found!")
                  exit(1)

              with open(SOURCES_FILE, 'r') as f:
                  urls = [line.strip() for line in f if line.strip() and not line.startswith('#')]

              # Write Header
              master_content.append("#EXTM3U")
              master_content.append(f"# Generated on {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S')} UTC")

              for index, url in enumerate(urls):
                  group_name = get_filename_from_url(url)
                  print(f"⬇️ [{index+1}/{len(urls)}] Processing: {group_name}...")

                  try:
                      response = requests.get(url, headers={"User-Agent": USER_AGENT}, timeout=30)
                      response.raise_for_status()
                      lines = response.text.splitlines()
                  except Exception as e:
                      print(f"⚠️ Failed to download {group_name}: {e}")
                      continue
                  
                  # Regex patterns
                  group_title_pattern = re.compile(r'group-title="([^"]*)"', re.IGNORECASE)
                  
                  current_buffer = [] 
                  current_ua = None
                  current_cookie = None
                  
                  for line in lines:
                      line = line.strip()
                      if not line: continue

                      # 1. Handle Metadata (#EXTINF)
                      if line.startswith("#EXTINF"):
                          # Force the group title from filename
                          if 'group-title="' in line:
                              line = group_title_pattern.sub(f'group-title="{group_name}"', line)
                          else:
                              parts = line.split(',', 1)
                              if len(parts) == 2:
                                  line = f'{parts[0]} group-title="{group_name}",{parts[1]}'
                          current_buffer.append(line)

                      # 2. Capture VLC User-Agent
                      elif line.startswith("#EXTVLCOPT:http-user-agent="):
                          current_ua = line.split('=', 1)[1].strip()

                      # 3. Capture VLC Cookie
                      elif line.startswith("#EXTVLCOPT:http-cookie="):
                          current_cookie = line.split('=', 1)[1].strip()

                      # 4. Skip #EXTGRP and old #EXTVLCOPT lines (we re-process them)
                      elif line.startswith("#EXTGRP") or line.startswith("#EXTVLCOPT"):
                          pass

                      # 5. Keep other necessary tags (Kodi props, etc)
                      elif line.startswith("#"):
                          if not line.startswith("#EXTM3U"):
                              current_buffer.append(line)

                      # 6. Handle URL
                      else:
                          stream_url = line
                          
                          # Append headers if they were found in VLC tags
                          headers = []
                          if current_ua:
                              headers.append(f"User-Agent={current_ua}")
                          if current_cookie:
                              headers.append(f"Cookie={current_cookie}")
                          
                          if headers:
                              # If URL acts like a query param, ensure we append correctly
                              stream_url += "|" + "&".join(headers)

                          if stream_url not in seen_urls:
                              seen_urls.add(stream_url)
                              master_content.extend(current_buffer)
                              master_content.append(f"#EXTGRP:{group_name}")
                              master_content.append(stream_url)
                          
                          # Reset for next item
                          current_buffer = []
                          current_ua = None
                          current_cookie = None

              with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:
                  f.write('\n'.join(master_content))
              
              print(f"✅ Finished! Total channels: {len(seen_urls)}")

          if __name__ == "__main__":
              download_and_parse()
          EOF

          pip install requests
          python3 process_m3u.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master.m3u
          if git diff --staged --quiet; then
            echo "ℹ️ No changes."
          else
            git commit -m "🤖 Update playlist with Headers fix"
            git push
          fi
