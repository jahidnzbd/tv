name: Auto Combine M3U Playlists

on:
  schedule:
    - cron: "0 * * * *"   # প্রতি ঘন্টায় রান করবে
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ✅ Step 1: Checkout Repo
      - name: Checkout Code
        uses: actions/checkout@v4

      # ✅ Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ✅ Step 3: Process & Combine Playlists
      - name: Download + Combine Playlists with Group Title
        run: |
          cat << 'EOF' > process_m3u.py
          import os
          import requests
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          # Files
          SOURCES_FILE = "sources.txt"
          OUTPUT_FILE = "master.m3u"

          # User Agent
          DL_USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"

          # Extract group-title from filename
          def get_group_title(url):
              path = urlparse(url).path
              filename = os.path.basename(path)

              if filename.lower().endswith(".m3u"):
                  return filename[:-4]  # remove .m3u
              return "Unknown"

          def main():
              seen_urls = set()
              master = []

              # Check sources file
              if not os.path.exists(SOURCES_FILE):
                  print("❌ sources.txt not found!")
                  exit(1)

              # Read all source URLs in serial order
              with open(SOURCES_FILE, "r") as f:
                  urls = [
                      line.strip()
                      for line in f
                      if line.strip() and not line.startswith("#")
                  ]

              # Master Header
              master.append("#EXTM3U")
              master.append(
                  f"# Generated on {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S')} UTC"
              )

              # Process each playlist
              for i, url in enumerate(urls):
                  group_title = get_group_title(url)
                  print(f"⬇️ Source {i+1}: {group_title}")

                  # Download playlist
                  try:
                      r = requests.get(
                          url,
                          headers={"User-Agent": DL_USER_AGENT},
                          timeout=30
                      )
                      r.raise_for_status()
                      lines = r.text.splitlines()

                  except Exception as e:
                      print(f"⚠️ Failed: {e}")
                      continue

                  current_extinf = None

                  # Parse playlist lines
                  for line in lines:
                      line = line.strip()
                      if not line:
                          continue

                      # Skip header
                      if line.startswith("#EXTM3U"):
                          continue

                      # EXTINF line → Inject group-title
                      if line.startswith("#EXTINF"):
                          if 'group-title="' not in line:
                              parts = line.split(",", 1)
                              if len(parts) == 2:
                                  left, name = parts
                                  current_extinf = f'{left} group-title="{group_title}",{name}'
                              else:
                                  current_extinf = line
                          else:
                              current_extinf = line

                      # URL line
                      elif line.startswith("http"):
                          stream_url = line

                          if stream_url not in seen_urls:
                              seen_urls.add(stream_url)

                              if current_extinf:
                                  master.append(current_extinf)

                              master.append(stream_url)

                          current_extinf = None

              # Save master file
              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  f.write("\n".join(master))

              print(f"✅ Done! Total Channels: {len(seen_urls)}")

          if __name__ == "__main__":
              main()
          EOF

          pip install requests
          python3 process_m3u.py

      # ✅ Step 4: Commit & Push Changes
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add master.m3u

          if git diff --staged --quiet; then
            echo "ℹ️ No changes found."
          else
            git commit -m "🤖 Auto-update: Combined with Group Titles"
            git push
          fi
