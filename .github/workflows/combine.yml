name: Auto Combine M3U Playlists

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Process Playlists
        run: |
          cat << 'EOF' > process_m3u.py
          import os
          import requests
          from datetime import datetime, timezone

          # Configuration
          SOURCES_FILE = "sources.txt"
          OUTPUT_FILE = "master.m3u"
          DL_USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"

          def download_and_parse():
              seen_urls = set()
              master_content = []

              if not os.path.exists(SOURCES_FILE):
                  print(f"❌ Error: {SOURCES_FILE} not found!")
                  exit(1)

              with open(SOURCES_FILE, 'r') as f:
                  urls = [line.strip() for line in f if line.strip() and not line.startswith('#')]

              # Write Header
              master_content.append("#EXTM3U")
              master_content.append(f"# Generated on {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S')} UTC")

              for index, url in enumerate(urls):
                  print(f"⬇️ Processing Source {index+1}...")

                  try:
                      response = requests.get(url, headers={"User-Agent": DL_USER_AGENT}, timeout=30)
                      response.raise_for_status()
                      lines = response.text.splitlines()
                  except Exception as e:
                      print(f"⚠️ Failed to download source {index+1}: {e}")
                      continue
                  
                  current_buffer = [] 
                  current_ua = None
                  current_cookie = None
                  
                  for line in lines:
                      line = line.strip()
                      if not line: continue

                      # 1. EXTRACT HEADERS (VLC Options)
                      if line.startswith("#EXTVLCOPT:http-user-agent="):
                          current_ua = line.split('=', 1)[1].strip()

                      elif line.startswith("#EXTVLCOPT:http-cookie="):
                          current_cookie = line.split('=', 1)[1].strip()

                      # 2. SKIP VLC TAGS (Since we extract them)
                      elif line.startswith("#EXTVLCOPT"):
                          pass 

                      # 3. PRESERVE ALL OTHER METADATA (No renaming, No edits)
                      elif line.startswith("#"):
                          if not line.startswith("#EXTM3U"):
                              current_buffer.append(line)

                      # 4. HANDLE URL (Append Headers)
                      else:
                          stream_url = line
                          
                          # Combine Headers Raw (Exactly as in source)
                          headers = []
                          if current_ua:
                              headers.append(f"User-Agent={current_ua}")
                          if current_cookie:
                              headers.append(f"Cookie={current_cookie}")
                          
                          if headers:
                              # Append with pipe (|)
                              separator = "&" if "|" in stream_url else "|"
                              stream_url += separator + "&".join(headers)

                          if stream_url not in seen_urls:
                              seen_urls.add(stream_url)
                              master_content.extend(current_buffer)
                              master_content.append(stream_url)
                          
                          # Reset
                          current_buffer = []
                          current_ua = None
                          current_cookie = None

              with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:
                  f.write('\n'.join(master_content))
              
              print(f"✅ Finished! Total channels: {len(seen_urls)}")

          if __name__ == "__main__":
              download_and_parse()
          EOF

          pip install requests
          python3 process_m3u.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master.m3u
          if git diff --staged --quiet; then
            echo "ℹ️ No changes."
          else
            git commit -m "🤖 Auto-update: Raw Combine"
            git push
          fi
