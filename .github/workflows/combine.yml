name: Auto Combine M3U Playlists

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Process Playlists
        run: |
          cat << 'EOF' > process_m3u.py
          import os
          import re
          import requests
          import urllib.parse
          from datetime import datetime, timezone

          # Configuration
          SOURCES_FILE = "sources.txt"
          OUTPUT_FILE = "master.m3u"
          # User-Agent for downloading the playlist file itself
          DL_USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"

          def get_group_name_from_url(url):
              # 1. Remove query parameters (after ?)
              path = url.split('?')[0]
              # 2. Get the last part (filename)
              basename = os.path.basename(path)
              # 3. Remove extension (.m3u, .txt, etc)
              name, _ = os.path.splitext(basename)
              return name if name else "Unknown"

          def download_and_parse():
              seen_urls = set()
              master_content = []

              if not os.path.exists(SOURCES_FILE):
                  print(f"❌ Error: {SOURCES_FILE} not found!")
                  exit(1)

              with open(SOURCES_FILE, 'r') as f:
                  urls = [line.strip() for line in f if line.strip() and not line.startswith('#')]

              # Write Header
              master_content.append("#EXTM3U")
              master_content.append(f"# Generated on {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S')} UTC")

              # Compile Regex for finding group-title="ANYTHING"
              group_title_pattern = re.compile(r'group-title="([^"]*)"', re.IGNORECASE)

              for index, url in enumerate(urls):
                  # EXTRACT NAME FROM LINK HERE
                  source_name = get_group_name_from_url(url)
                  print(f"⬇️ Processing: {source_name}...")

                  try:
                      response = requests.get(url, headers={"User-Agent": DL_USER_AGENT}, timeout=30)
                      response.raise_for_status()
                      lines = response.text.splitlines()
                  except Exception as e:
                      print(f"⚠️ Failed to download {source_name}: {e}")
                      continue
                  
                  current_buffer = [] 
                  current_ua = None
                  current_cookie = None
                  
                  for line in lines:
                      line = line.strip()
                      if not line: continue

                      # --- LINE PROCESSING ---

                      if line.startswith("#EXTINF"):
                          # REWRITE GROUP TITLE
                          if 'group-title="' in line:
                              # Replace existing group-title with source_name
                              line = group_title_pattern.sub(f'group-title="{source_name}"', line)
                          else:
                              # Insert group-title if it is missing
                              parts = line.split(',', 1)
                              if len(parts) == 2:
                                  line = f'{parts[0]} group-title="{source_name}",{parts[1]}'
                          current_buffer.append(line)

                      elif line.startswith("#EXTVLCOPT:http-user-agent="):
                          current_ua = line.split('=', 1)[1].strip()

                      elif line.startswith("#EXTVLCOPT:http-cookie="):
                          current_cookie = line.split('=', 1)[1].strip()

                      # REMOVE #EXTGRP COMPLETELY
                      elif line.startswith("#EXTGRP"):
                          pass 

                      elif line.startswith("#EXTVLCOPT"):
                          pass # Skip other VLC opts

                      elif line.startswith("#"):
                          # Keep #KODIPROP and others
                          if not line.startswith("#EXTM3U"):
                              current_buffer.append(line)

                      else:
                          # IT IS A URL
                          stream_url = line
                          
                          # CONVERT HEADERS TO PIPE FORMAT (|)
                          headers = []
                          if current_ua:
                              # Encode spaces and special chars for OTT Navigator
                              headers.append(f"User-Agent={urllib.parse.quote(current_ua)}")
                          if current_cookie:
                              headers.append(f"Cookie={urllib.parse.quote(current_cookie)}")
                          
                          if headers:
                              # If URL already has pipes, use & to append
                              if "|" in stream_url:
                                  stream_url += "&" + "&".join(headers)
                              else:
                                  stream_url += "|" + "&".join(headers)

                          if stream_url not in seen_urls:
                              seen_urls.add(stream_url)
                              master_content.extend(current_buffer)
                              # Note: We do NOT add #EXTGRP here
                              master_content.append(stream_url)
                          
                          # Reset buffer
                          current_buffer = []
                          current_ua = None
                          current_cookie = None

              with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:
                  f.write('\n'.join(master_content))
              
              print(f"✅ Finished! Total channels: {len(seen_urls)}")

          if __name__ == "__main__":
              download_and_parse()
          EOF

          pip install requests
          python3 process_m3u.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master.m3u
          if git diff --staged --quiet; then
            echo "ℹ️ No changes."
          else
            git commit -m "🤖 Update playlist: Extracted Group Names"
            git push
          fi
