name: Auto Combine M3U Playlists

permissions:
  contents: write

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare temp folder
        run: |
          mkdir -p temp
          rm -rf temp/*

      - name: Download playlists
        run: |
          set -euo pipefail

          total_sources=$(grep -v '^[[:space:]]*#' sources.txt | grep -v '^$' | wc -l)
          echo "📋 Found $total_sources sources"

          n=1

          while IFS= read -r url || [ -n "$url" ]; do
            [[ -z "$url" || "$url" =~ ^[[:space:]]*# ]] && continue

            echo "➡ Downloading ($n/$total_sources): $url"

            timeout 120 curl -L \
              --retry 3 \
              --retry-delay 3 \
              --connect-timeout 30 \
              --max-time 120 \
              --silent --show-error \
              -o "temp/playlist$n.m3u" \
              "$url" || rm -f "temp/playlist$n.m3u"

            if [ -s "temp/playlist$n.m3u" ]; then
              echo "✅ playlist$n downloaded"
              n=$((n+1))
            else
              echo "❌ Failed playlist$n"
            fi

            sleep 1
          done < sources.txt

      - name: Combine playlists safely
        run: |
          set -euo pipefail
          shopt -s nullglob

          echo "#EXTM3U" > master.m3u
          echo "# Generated on $(date -u)" >> master.m3u

          for f in temp/*.m3u; do
            grep -v "^\s*#EXTM3U" "$f" >> master.m3u
          done

          echo "🧹 Removing duplicate stream URLs safely..."

          mv master.m3u master.tmp

          awk '
            /^#EXTINF/ {info=$0; next}
            /^http/ {
              if (!seen[$0]++) {
                print info
                print $0
              }
            }
            /^#/ {print}
          ' master.tmp > master.m3u

          rm master.tmp

          echo "✅ master.m3u ready with full data"

      - name: Cleanup temp
        run: rm -rf temp

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & Push if changed
        run: |
          git add master.m3u

          if git diff --cached --quiet; then
            echo "ℹ No changes"
          else
            git commit -m "🤖 Auto update playlist"
            git push
          fi
