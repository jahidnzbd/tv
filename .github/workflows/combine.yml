name: Auto Combine M3U Playlists

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Process Playlists
        run: |
          # Create a python script dynamically
          cat << 'EOF' > process_m3u.py
          import os
          import re
          import requests
          from datetime import datetime, timezone

          # Configuration
          SOURCES_FILE = "sources.txt"
          OUTPUT_FILE = "master.m3u"
          USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"

          def get_filename_from_url(url):
              # Extract filename from URL (e.g., "RoarZone" from ".../RoarZone.m3u")
              path = url.split('?')[0]  # Remove query params
              basename = os.path.basename(path)
              name, _ = os.path.splitext(basename)
              return name if name else "Unknown_Source"

          def download_and_parse():
              seen_urls = set()
              master_content = []

              if not os.path.exists(SOURCES_FILE):
                  print(f"❌ Error: {SOURCES_FILE} not found!")
                  exit(1)

              with open(SOURCES_FILE, 'r') as f:
                  urls = [line.strip() for line in f if line.strip() and not line.startswith('#')]

              print(f"📋 Found {len(urls)} sources.")

              # Write Header
              master_content.append("#EXTM3U")
              master_content.append(f"# Generated on {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S')} UTC")

              for index, url in enumerate(urls):
                  group_name = get_filename_from_url(url)
                  print(f"⬇️ [{index+1}/{len(urls)}] Processing: {group_name}...")

                  try:
                      response = requests.get(url, headers={"User-Agent": USER_AGENT}, timeout=30)
                      response.raise_for_status()
                      lines = response.text.splitlines()
                  except Exception as e:
                      print(f"⚠️ Failed to download {group_name}: {e}")
                      continue

                  # Regex to find group-title="..." and replace it
                  # This regex looks for group-title="ANYTHING" and prepares to replace it
                  group_title_pattern = re.compile(r'group-title="([^"]*)"', re.IGNORECASE)
                  
                  current_buffer = [] # Holds metadata lines before a URL
                  
                  for line in lines:
                      line = line.strip()
                      if not line: 
                          continue

                      if line.startswith("#EXTINF"):
                          # Force update the group-title in the EXTINF line
                          if 'group-title="' in line:
                              # Replace existing group-title
                              line = group_title_pattern.sub(f'group-title="{group_name}"', line)
                          else:
                              # Insert group-title if missing (after #EXTINF:-1)
                              # Simple insertion: replace the comma with space + group + comma
                              parts = line.split(',', 1)
                              if len(parts) == 2:
                                  line = f'{parts[0]} group-title="{group_name}",{parts[1]}'
                          
                          current_buffer.append(line)

                      elif line.startswith("#EXTGRP"):
                          # Skip original group tags, we will force our own
                          pass

                      elif line.startswith("#"):
                          # Keep other tags like #EXTVLCOPT
                          if not line.startswith("#EXTM3U"):
                              current_buffer.append(line)

                      else:
                          # It is a URL
                          stream_url = line
                          if stream_url not in seen_urls:
                              seen_urls.add(stream_url)
                              
                              # Write the buffer (metadata)
                              master_content.extend(current_buffer)
                              
                              # Explicitly add #EXTGRP for players that prefer this
                              master_content.append(f"#EXTGRP:{group_name}")
                              
                              # Write the URL
                              master_content.append(stream_url)
                          
                          # Clear buffer
                          current_buffer = []

              # Write to file
              with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:
                  f.write('\n'.join(master_content))
              
              print(f"✅ Finished! Total channels: {len(seen_urls)}")

          if __name__ == "__main__":
              download_and_parse()
          EOF

          # Install requests library
          pip install requests

          # Run the script
          python3 process_m3u.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add master.m3u

          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit."
          else
            git commit -m "🤖 Update playlist: Organized by source groups"
            git push
            echo "🚀 Pushed changes."
          fi
