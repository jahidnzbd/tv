name: Auto Combine M3U Playlists

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  merge-playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Combine Playlists
        run: |
          cat << 'EOF' > process_m3u.py
          import os
          import re
          import requests
          from urllib.parse import urlparse
          from datetime import datetime, timezone

          SOURCES_FILE = "sources.txt"
          OUTPUT_FILE = "master.m3u"

          UA = "Mozilla/5.0"

          # URL filename থেকে unique group name বের করবে
          def get_unique_group(url, seen_groups):
              path = urlparse(url).path
              filename = os.path.basename(path)
              
              # .m3u বা .m3u8 রিমুভ করা
              group = re.sub(r'\.m3u8?$', '', filename)
              
              # URL-এ কোনো filename না থাকলে fallback
              if not group:
                  group = "Playlist"
                  
              original_group = group
              counter = 1
              
              # Duplicate name থাকলে শেষে _1, _2 অ্যাড করা
              while group in seen_groups:
                  group = f"{original_group}_{counter}"
                  counter += 1
                  
              seen_groups.add(group)
              return group

          def main():
              if not os.path.exists(SOURCES_FILE):
                  print("❌ sources.txt missing")
                  exit(1)

              with open(SOURCES_FILE, "r", encoding="utf-8") as f:
                  sources = [
                      x.strip()
                      for x in f
                      if x.strip() and not x.startswith("#")
                  ]

              output = []
              output.append("#EXTM3U")
              output.append(f"# Generated {datetime.now(timezone.utc)} UTC")

              seen_urls = set()
              seen_groups = set()

              for url in sources:
                  group = get_unique_group(url, seen_groups)
                  print(f"📂 Processing group: {group}")

                  try:
                      r = requests.get(
                          url,
                          headers={"User-Agent": UA},
                          timeout=30
                      )
                      r.raise_for_status()
                      lines = r.text.splitlines()

                  except Exception as e:
                      print(f"⚠️ Download failed for {url}: {e}")
                      continue

                  last_extinf = None

                  for line in lines:
                      line = line.rstrip()

                      if line.startswith("#EXTM3U"):
                          continue

                      # EXTINF line
                      if line.startswith("#EXTINF"):
                          # Existing group-title replace
                          if 'group-title="' in line:
                              line = re.sub(
                                  r'group-title="[^"]*"',
                                  f'group-title="{group}"',
                                  line
                              )
                          # group-title add (Robust regex for standard M3U formats)
                          else:
                              match = re.match(r'(#EXTINF:[^,]+)(,.*)', line)
                              if match:
                                  line = f'{match.group(1)} group-title="{group}"{match.group(2)}'
                              else:
                                  line = line.replace("#EXTINF:", f'#EXTINF:-1 group-title="{group}" ', 1)

                          last_extinf = line
                          continue

                      # Stream URL
                      if line.startswith("http"):
                          if line not in seen_urls:
                              seen_urls.add(line)

                              if last_extinf:
                                  output.append(last_extinf)
                              else:
                                  # Force assign a group even if the original source missed the #EXTINF tag
                                  output.append(f'#EXTINF:-1 group-title="{group}",Unknown Channel')

                              output.append(line)

                          last_extinf = None
                          continue

                      # Other metadata
                      if line.startswith("#") and not line.startswith("#EXTINF"):
                          output.append(line)

              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  f.write("\n".join(output) + "\n")

              print(f"✅ Done. Total unique channels: {len(seen_urls)}")

          if __name__ == "__main__":
              main()
          EOF

          python process_m3u.py

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add master.m3u

          if git diff --staged --quiet; then
            echo "ℹ️ No changes detected."
          else
            git commit -m "🤖 Auto-update playlists"
            git push origin HEAD:main
          fi
